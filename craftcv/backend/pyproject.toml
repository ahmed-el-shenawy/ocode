[project]
name = "craftcv-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "supabase",
    "litellm",
    "playwright",
    "jinja2",
    "python-multipart",
    "httpx",
    "duckduckgo-search",
    "celery",
    "redis",
    "python-dotenv",
    "passlib[bcrypt]",
    "python-jose[cryptography]",
    "jsonschema",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
